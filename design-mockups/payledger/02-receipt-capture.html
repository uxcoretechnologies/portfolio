<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="icons">
      <svg width="22" height="16" viewBox="0 0 22 16"><rect x="0" y="9" width="4" height="7" rx="1" fill="var(--ink)"/><rect x="6" y="6" width="4" height="10" rx="1" fill="var(--ink)"/><rect x="12" y="3" width="4" height="13" rx="1" fill="var(--ink)"/><rect x="18" y="0" width="4" height="16" rx="1" fill="var(--ink)" opacity="0.3"/></svg>
      <svg width="30" height="16" viewBox="0 0 30 16"><rect x="1" y="1" width="24" height="14" rx="3.5" stroke="var(--ink)" stroke-width="1.5" fill="none"/><rect x="3" y="3" width="17" height="10" rx="2" fill="var(--ink)"/><rect x="27" y="5.5" width="2" height="5" rx="1" fill="var(--ink)"/></svg>
    </div>
  </div>

  <div class="appbar">
    <div><div class="greet">Capture</div><div class="title">Scan a receipt</div></div>
    <div class="avatar"></div>
  </div>

  <div class="content">
    <div class="receipt-photo">
      <span class="scan-badge">&#10003; Captured</span>
      <div class="paper">
        <div class="rline" style="width:70%;"></div>
        <div class="rline short"></div>
        <div style="height:10px;"></div>
        <div class="rline"></div><div class="rline"></div><div class="rline short"></div>
        <div style="height:10px;"></div>
        <div class="rline" style="width:50%;"></div>
      </div>
    </div>

    <div class="card fields-card">
      <div class="field-row"><span class="lbl">Vendor</span><span class="v">Northline Supplies</span></div>
      <div class="field-row"><span class="lbl">Amount</span><span class="v mono-num">$84.12</span></div>
      <div class="field-row"><span class="lbl">Date</span><span class="v">Sept 9, 2026</span></div>
      <div class="field-row">
        <span class="lbl">Category</span>
        <span class="cat-chip">&#128230; Office Supplies &middot; 96%</span>
      </div>
    </div>

    <div class="confirm-row">
      <div class="btn ghost">Edit</div>
      <div class="btn primary">Confirm</div>
    </div>

    <div class="card" style="padding:22px 26px;">
      <div class="eyebrow" style="margin-bottom:8px;">Recent captures</div>
      <div class="recent-list">
        <div class="recent-row"><span>Riverside Print Co.</span><span class="mono-num">$32.50</span></div>
        <div class="recent-row"><span>Fresh Grounds Coffee</span><span class="mono-num">$14.20</span></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7M5 10v9h14v-9"/></svg>Home</div>
    <div class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Accounts</div>
    <div class="tab active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add</div>
    <div class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M12 19V4M20 19v-6"/></svg>Insights</div>
  </div>
</div>
</body></html>
